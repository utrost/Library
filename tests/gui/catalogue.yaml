scripts:
  author-destination:
    description: Search after three letters, select or explicitly create a destination, review and cancel without moving books; repeat on mobile.
    tags: [authors, smoke, mobile]
    file: tests/gui/details/author-destination.spec.ts
    command: npm run test:gui -- tests/gui/details/author-destination.spec.ts

  editor-entry-points:
    description: Open the single editor from author and series pages or a legacy bookmark; verify Back, authorization, feedback and disclosures.
    tags: [details, smoke, mobile]
    file: tests/gui/details/editor-entry-points.spec.ts
    command: npm run test:gui -- tests/gui/details/editor-entry-points.spec.ts

  catalogue-search-detail:
    description: Use the main Search form, open Quick view, close it with restored focus and inspect the List view.
    tags: [catalogue, detail, smoke]
    file: tests/gui/catalogue/catalogue-search-detail.spec.ts
    command: npm run test:gui -- tests/gui/catalogue/catalogue-search-detail.spec.ts

  catalogue-filter-chips-clear-all:
    description: Apply desktop search and format filters, remove one chip, then clear selection filters while preserving Sort and View.
    tags: [catalogue, filters, regression, desktop]
    file: tests/gui/catalogue/catalogue-filter-chips-clear-all.spec.ts
    command: npm run test:gui:desktop -- tests/gui/catalogue/catalogue-filter-chips-clear-all.spec.ts

  catalogue-empty-results-recovery:
    description: Verify a guaranteed-missing search has consistent empty and active-filter state, then clears cleanly back to the catalogue.
    tags: [catalogue, search, edge-case, regression]
    file: tests/gui/catalogue/catalogue-empty-results-recovery.spec.ts
    command: npm run test:gui:desktop -- tests/gui/catalogue/catalogue-empty-results-recovery.spec.ts

  catalogue-history-navigation:
    description: Preserve search, format, list view, card, and detail-sidebar state through browser back and forward navigation.
    tags: [catalogue, navigation, timing, regression]
    file: tests/gui/catalogue/catalogue-history-navigation.spec.ts
    command: npm run test:gui:desktop -- tests/gui/catalogue/catalogue-history-navigation.spec.ts

  catalogue-loading-state:
    description: Delay one catalogue response and verify pending aria-busy/status behavior, stale results, and the final cleared loading state.
    tags: [catalogue, loading, timing, regression]
    file: tests/gui/catalogue/catalogue-loading-state.spec.ts
    command: npm run test:gui:desktop -- tests/gui/catalogue/catalogue-loading-state.spec.ts

  details-metadata-edit-persistence:
    description: Edit a deterministic title in Book details, prove it survives a root rescan, repair it through Suggested updates, and verify the original value.
    tags: [details, metadata, smoke, mutation]
    file: tests/gui/details/metadata-edit-persistence.spec.ts
    command: npm run test:gui:desktop -- tests/gui/details/metadata-edit-persistence.spec.ts

  details-unified-book-editor:
    description: Stage title, rating, author, series, and genre changes; save once; reject a stale tab; and restore the fixture.
    tags: [details, metadata, smoke, mutation]
    file: tests/gui/details/unified-book-editor.spec.ts
    command: npm run test:gui:desktop -- tests/gui/details/unified-book-editor.spec.ts

  scan-root-browse:
    description: Scan one configured test root, wait for its new job to complete, then find the expected publication in Catalogue.
    tags: [scan, catalogue, smoke, mutation]
    file: tests/gui/settings/scan-root-browse.spec.ts
    command: npm run test:gui:desktop -- tests/gui/settings/scan-root-browse.spec.ts

  metadata-export-import-roundtrip:
    description: Export one corrected item, import a changed title through preview and apply, verify it, then restore the original title.
    tags: [metadata, import, export, smoke, mutation]
    file: tests/gui/settings/metadata-export-import-roundtrip.spec.ts
    command: npm run test:gui:desktop -- tests/gui/settings/metadata-export-import-roundtrip.spec.ts

  settings-folder-picker-existing-user:
    description: Open and close the real Nextcloud folder picker for an existing Library root without changing the saved path.
    tags: [settings, folder-picker, regression]
    file: tests/gui/settings/folder-picker-existing-user.spec.ts
    command: npm run test:gui -- tests/gui/settings/folder-picker-existing-user.spec.ts

  mobile-catalogue-filters:
    description: Search from the phone filter panel, verify the result and active-filter state, then clear the search.
    tags: [catalogue, filters, mobile, smoke]
    file: tests/gui/mobile/mobile-catalogue-filters.spec.ts
    command: npm run test:gui:mobile -- tests/gui/mobile/mobile-catalogue-filters.spec.ts

  mobile-no-horizontal-overflow:
    description: Check document, visible catalogue controls, mobile filters, and result cards remain inside the phone viewport.
    tags: [mobile, layout, css, regression]
    file: tests/gui/mobile/mobile-no-horizontal-overflow.spec.ts
    command: npm run test:gui:mobile -- tests/gui/mobile/mobile-no-horizontal-overflow.spec.ts

  ui-consistency:
    description: Verify main search, cover/editor versus Quick view destinations, Home covers, dirty-list navigation, import recovery, maintenance links and lookup failures.
    tags: [ux, navigation, details, mobile, import, regression]
    file: tests/gui/details/ui-consistency.spec.ts
    command: npm run test:gui -- tests/gui/details/ui-consistency.spec.ts

  author-browser:
    description: Browse author previews, sort and search, follow a book and restore directory state on desktop and mobile.
    tags: [authors, navigation, mobile, regression]
    file: tests/gui/details/author-browser.spec.ts
    command: npm run test:gui -- tests/gui/details/author-browser.spec.ts

  catalogue-list-layout:
    description: Measure cover proportions and table overflow on desktop and mobile.
    tags: [catalogue, layout, mobile, regression]
    file: tests/gui/catalogue/catalogue-list-layout.spec.ts
    command: npm run test:gui -- tests/gui/catalogue/catalogue-list-layout.spec.ts

  final-ui-consistency:
    description: Verify profile drafts, keyboard facets, seeded language review, navigation and error contrast.
    tags: [ux, keyboard, mobile, regression]
    file: tests/gui/details/final-ui-consistency.spec.ts
    command: npm run test:gui -- tests/gui/details/final-ui-consistency.spec.ts

  ux-follow-up:
    description: Exercise picker selection, directory drafts, restored scroll and series toolbar navigation.
    tags: [ux, navigation, mobile, mutation]
    file: tests/gui/details/ux-follow-up.spec.ts
    command: npm run test:gui -- tests/gui/details/ux-follow-up.spec.ts

  personal-lists:
    description: Create, order, annotate and remove a disposable private list; check mobile editing.
    tags: [lists, mobile, mutation]
    file: tests/gui/lists/personal-lists.spec.ts
    command: npm run test:gui -- tests/gui/lists/personal-lists.spec.ts

  path-inference:
    description: Preview, save and delete inference patterns; check label help, ownership and CSRF.
    tags: [inference, mobile, security]
    file: tests/gui/inference/path-inference.spec.ts
    command: npm run test:gui -- tests/gui/inference/path-inference.spec.ts

  context-help:
    description: Check settings label help, focus, dismissal and accessible descriptions.
    tags: [settings, accessibility, regression]
    file: tests/gui/settings/context-help.spec.ts
    command: npm run test:gui -- tests/gui/settings/context-help.spec.ts

  thumbnail-cache:
    description: Configure thumbnail budgets and retention on a disposable admin account and restore settings.
    tags: [settings, performance, mutation]
    file: tests/gui/settings/thumbnail-cache.spec.ts
    command: npm run test:gui -- tests/gui/settings/thumbnail-cache.spec.ts

scripts:
  catalogue-search-detail:
    description: Search for one deterministic publication, open its details drawer, and close it with restored focus.
    tags: [catalogue, detail, smoke]
    file: tests/gui/catalogue/catalogue-search-detail.spec.ts
    command: npm run test:gui -- tests/gui/catalogue/catalogue-search-detail.spec.ts

  catalogue-filter-chips-clear-all:
    description: Apply desktop search and format filters, remove one chip, then clear selection filters while preserving Sort and View.
    tags: [catalogue, filters, regression, desktop]
    file: tests/gui/catalogue/catalogue-filter-chips-clear-all.spec.ts
    command: npm run test:gui:desktop -- tests/gui/catalogue/catalogue-filter-chips-clear-all.spec.ts

  catalogue-empty-results-recovery:
    description: Verify a guaranteed-missing search has consistent empty and active-filter state, then clears cleanly back to the catalogue.
    tags: [catalogue, search, edge-case, regression]
    file: tests/gui/catalogue/catalogue-empty-results-recovery.spec.ts
    command: npm run test:gui:desktop -- tests/gui/catalogue/catalogue-empty-results-recovery.spec.ts

  catalogue-history-navigation:
    description: Preserve search, format, list view, card, and detail-sidebar state through browser back and forward navigation.
    tags: [catalogue, navigation, timing, regression]
    file: tests/gui/catalogue/catalogue-history-navigation.spec.ts
    command: npm run test:gui:desktop -- tests/gui/catalogue/catalogue-history-navigation.spec.ts

  catalogue-loading-state:
    description: Delay one catalogue response and verify pending aria-busy/status behavior, stale results, and the final cleared loading state.
    tags: [catalogue, loading, timing, regression]
    file: tests/gui/catalogue/catalogue-loading-state.spec.ts
    command: npm run test:gui:desktop -- tests/gui/catalogue/catalogue-loading-state.spec.ts

  details-metadata-edit-persistence:
    description: Edit a deterministic publication title, prove it survives a root rescan, repair it through Suggested updates, and verify the original value.
    tags: [details, metadata, smoke, mutation]
    file: tests/gui/details/metadata-edit-persistence.spec.ts
    command: npm run test:gui:desktop -- tests/gui/details/metadata-edit-persistence.spec.ts

  scan-root-browse:
    description: Scan one configured test root, wait for its new job to complete, then find the expected publication in Catalogue.
    tags: [scan, catalogue, smoke, mutation]
    file: tests/gui/settings/scan-root-browse.spec.ts
    command: npm run test:gui:desktop -- tests/gui/settings/scan-root-browse.spec.ts

  metadata-export-import-roundtrip:
    description: Export one corrected item, import a changed title through preview and apply, verify it, then restore the original title.
    tags: [metadata, import, export, smoke, mutation]
    file: tests/gui/settings/metadata-export-import-roundtrip.spec.ts
    command: npm run test:gui:desktop -- tests/gui/settings/metadata-export-import-roundtrip.spec.ts

  settings-folder-picker-existing-user:
    description: Open and close the real Nextcloud folder picker for an existing Library root without changing the saved path.
    tags: [settings, folder-picker, regression]
    file: tests/gui/settings/folder-picker-existing-user.spec.ts
    command: npm run test:gui -- tests/gui/settings/folder-picker-existing-user.spec.ts

  mobile-catalogue-filters:
    description: Search from the phone filter panel, verify the result and active-filter state, then clear the search.
    tags: [catalogue, filters, mobile, smoke]
    file: tests/gui/mobile/mobile-catalogue-filters.spec.ts
    command: npm run test:gui:mobile

  mobile-no-horizontal-overflow:
    description: Check document, visible catalogue controls, mobile filters, and result cards remain inside the phone viewport.
    tags: [mobile, layout, css, regression]
    file: tests/gui/mobile/mobile-no-horizontal-overflow.spec.ts
    command: npm run test:gui:mobile -- tests/gui/mobile/mobile-no-horizontal-overflow.spec.ts

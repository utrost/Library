name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed=v7 source=https://github.com/actions/checkout/releases/tag/v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # reviewed=v7 source=https://github.com/actions/setup-python/releases/tag/v7
        with:
          python-version: '3.11'

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # reviewed=v2 source=https://github.com/shivammathur/setup-php/releases/tag/v2
        with:
          php-version: '8.3'

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # reviewed=v7 source=https://github.com/actions/setup-node/releases/tag/v7
        with:
          node-version: 24
          cache: npm

      - name: Install Python test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Production dependency vulnerability audit
        run: npm audit --audit-level=high --omit=dev

      - name: Run local supply-chain security gates
        run: bash scripts/security-gates.sh

      - name: Run Python contracts
        run: python -m pytest -q

      - name: Run PHP runtime tests
        run: ./scripts/run-php-runtime-tests.sh

      - name: Lint instrumentation PHP
        run: |
          php -l lib/Instrumentation/MonotonicClock.php
          php -l lib/Instrumentation/ScanProgressPolicy.php
          php -l lib/Exception/ScanCancelledException.php
          php -l lib/Service/ScanJobService.php
          php -l lib/Service/LibraryScanner.php
          php -l lib/BackgroundJob/ScanJob.php
          php -l lib/Migration/Version000100Date20260911140000.php
          php -l tests/php/performance_instrumentation_test.php
          php -l tests/php/library_scanner_traversal_test.php
          php -l tests/php/scan_job_runtime_test.php
          php -l tests/php/scan_job_service_test.php

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend assets
        run: npm run build

      - name: Check whitespace
        run: git diff --check

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # reviewed=v7 source=https://github.com/actions/upload-artifact/releases/tag/v7
        with:
          name: security-reports-${{ github.run_attempt }}
          path: security-reports/
          if-no-files-found: ignore
          retention-days: 14

  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed=v7 source=https://github.com/actions/checkout/releases/tag/v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # reviewed=v7 source=https://github.com/actions/setup-node/releases/tag/v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # reviewed=v7 source=https://github.com/actions/setup-python/releases/tag/v7
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run disposable Nextcloud GUI rehearsal
        env:
          CI: "true"
          LIBRARY_FRESH_MIXED_COUNT: "40"
        run: npm run smoke:fresh-install-mixed

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # reviewed=v7 source=https://github.com/actions/upload-artifact/releases/tag/v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

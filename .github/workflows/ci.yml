name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pytest

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Python contracts
        run: python -m pytest -q

      - name: Run PHP runtime tests
        run: ./scripts/run-php-runtime-tests.sh

      - name: Lint instrumentation PHP
        run: |
          php -l lib/Instrumentation/MonotonicClock.php
          php -l lib/Instrumentation/ScanProgressPolicy.php
          php -l lib/Exception/ScanCancelledException.php
          php -l lib/Service/ScanJobService.php
          php -l lib/Service/LibraryScanner.php
          php -l lib/BackgroundJob/ScanJob.php
          php -l lib/Migration/Version000100Date20260911140000.php
          php -l tests/php/performance_instrumentation_test.php
          php -l tests/php/library_scanner_traversal_test.php
          php -l tests/php/scan_job_runtime_test.php
          php -l tests/php/scan_job_service_test.php

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend assets
        run: npm run build

      - name: Check whitespace
        run: git diff --check

  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run disposable Nextcloud GUI rehearsal
        env:
          CI: "true"
          LIBRARY_FRESH_MIXED_COUNT: "40"
        run: npm run smoke:fresh-install-mixed

      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Python test dependencies
        run: python -m pip install --upgrade pytest

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Python contracts
        run: python -m pytest -q

      - name: Run PHP runtime tests
        run: ./scripts/run-php-runtime-tests.sh

      - name: Lint instrumentation PHP
        run: |
          php -l lib/Instrumentation/MonotonicClock.php
          php -l lib/Instrumentation/ScanProgressPolicy.php
          php -l lib/Exception/ScanCancelledException.php
          php -l lib/Service/ScanJobService.php
          php -l lib/Service/LibraryScanner.php
          php -l lib/BackgroundJob/ScanJob.php
          php -l lib/Migration/Version000100Date20260911140000.php
          php -l tests/php/performance_instrumentation_test.php
          php -l tests/php/library_scanner_traversal_test.php
          php -l tests/php/scan_job_runtime_test.php
          php -l tests/php/scan_job_service_test.php

      - name: Run frontend tests
        run: npm test -- --run

      - name: Build frontend assets
        run: npm run build

      - name: Check whitespace
        run: git diff --check
